<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Beretta">
  <!-- Elegant redraw of the Beretta mark: hairline outer ring, three slender
       arrows with outlined heads, interlaced rings, single chevron fletching.
       Monochrome, no solid fills — technical-drawing feel. -->
  <g fill="none" stroke="#E7ECF5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="120" cy="120" r="104" stroke-width="5" opacity=".85"/>

    <!-- interlaced rings (P/B monogram), lightened -->
    <circle cx="102" cy="126" r="16" stroke-width="4.5" opacity=".9"/>
    <circle cx="138" cy="126" r="16" stroke-width="4.5" opacity=".9"/>

    <!-- center arrow -->
    <path d="M120 46 L111 64 L129 64 Z" stroke-width="5"/>
    <line x1="120" y1="64" x2="120" y2="170" stroke-width="5.5"/>
    <path d="M111 150 L120 159 L129 150" stroke-width="4" opacity=".7"/>

    <!-- left arrow -->
    <path d="M88 60 L81 74 L95 74 Z" stroke-width="4.5"/>
    <line x1="88" y1="74" x2="88" y2="164" stroke-width="5"/>
    <path d="M80 144 L88 152 L96 144" stroke-width="3.5" opacity=".7"/>

    <!-- right arrow -->
    <path d="M152 60 L145 74 L159 74 Z" stroke-width="4.5"/>
    <line x1="152" y1="74" x2="152" y2="164" stroke-width="5"/>
    <path d="M144 144 L152 152 L160 144" stroke-width="3.5" opacity=".7"/>
  </g>
</svg>
