<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="ModelVault">
  <defs>
    <linearGradient id="mvGrad" x1="0.12" y1="0.08" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#9C86F5"/>
      <stop offset="0.55" stop-color="#5AA6F6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- segmented ring -->
  <circle cx="120" cy="120" r="96" fill="none" stroke="url(#mvGrad)"
          stroke-width="4" stroke-dasharray="2.5 7" stroke-linecap="round" opacity="0.85"/>

  <!-- station dots on the ring -->
  <g fill="url(#mvGrad)">
    <circle cx="120"   cy="24"    r="6.5"/>
    <circle cx="187.9" cy="52.1"  r="6.5"/>
    <circle cx="216"   cy="120"   r="6.5"/>
    <circle cx="187.9" cy="187.9" r="6.5"/>
    <circle cx="120"   cy="216"   r="6.5"/>
    <circle cx="52.1"  cy="187.9" r="6.5"/>
    <circle cx="24"    cy="120"   r="6.5"/>
    <circle cx="52.1"  cy="52.1"  r="6.5"/>
  </g>

  <!-- MV monogram -->
  <text x="118" y="153" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="96" font-weight="800"
        letter-spacing="-5">
    <tspan fill="#EEF2FF">M</tspan><tspan fill="url(#mvGrad)">V</tspan>
  </text>
</svg>
